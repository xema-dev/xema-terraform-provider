name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: fmt / vet / test / build
    # GitHub-hosted: the org's self-hosted pool cannot serve this public repo.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - run: go mod download

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  # The one required check of the develop rulesets (XEMA-7710): green only when every job above is green.
  required:
    name: ci/required
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.ci.result }}" = success
