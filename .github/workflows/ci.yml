name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build / vet / fmt / test
    # GitHub-hosted. The org's self-hosted pool cannot serve this repo: the
    # `Default` runner group has `allows_public_repositories: false`, so jobs
    # labelled [self-hosted, linux] sat queued with no runner and were expired
    # by GitHub after 24h. This job only needs Go + public modules.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      # A tracked source file carrying a raw NUL is classified BINARY by ripgrep,
      # ugrep and `grep -I` — they skip the whole file and report zero matches,
      # so it is invisible to every audit and every grep-based check.
      # Self-contained (node builtins only): no install, nothing to lock.
      # ubuntu-latest ships a node, but the pin is explicit so the gate does not
      # depend on whatever version the runner image happens to carry.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        timeout-minutes: 5  # setup-node stalls indefinitely on this fleet; fail loudly instead of masking later steps
        with:
          node-version-file: .node-version

      - name: Every tracked source file is readable by search
        run: node tooling/boundaries/lib/source-readability.mjs
